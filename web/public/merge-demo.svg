<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Illustrative Files Format PDF merge workflow</title>
<desc id="desc">Two PDF files are arranged in order and merged into one downloadable PDF in the browser.</desc>
<rect width="1200" height="620" rx="28" fill="#f3f7fb"/><rect x="50" y="50" width="1100" height="520" rx="24" fill="#fff" stroke="#d8e2ec" stroke-width="3"/>
<text x="95" y="125" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#172d42">Merge PDF</text>
<text x="95" y="166" font-family="Arial,sans-serif" font-size="19" fill="#5e7184">Arrange your files, then combine them locally in your browser.</text>
<g transform="translate(105 235)"><rect width="250" height="230" rx="16" fill="#f6f9fc" stroke="#cbd8e5" stroke-width="3"/><rect x="28" y="25" width="62" height="78" rx="8" fill="#dceaf7" stroke="#477eb2" stroke-width="3"/><text x="112" y="62" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#203b55">first.pdf</text><text x="112" y="91" font-family="Arial,sans-serif" font-size="15" fill="#60758b">2 pages</text><text x="28" y="155" font-family="Arial,sans-serif" font-size="17" fill="#5d7084">1 · Move up / down</text><text x="28" y="190" font-family="Arial,sans-serif" font-size="17" fill="#5d7084">Local preview</text></g>
<g transform="translate(390 235)"><rect width="250" height="230" rx="16" fill="#f6f9fc" stroke="#cbd8e5" stroke-width="3"/><rect x="28" y="25" width="62" height="78" rx="8" fill="#dceaf7" stroke="#477eb2" stroke-width="3"/><text x="112" y="62" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#203b55">second.pdf</text><text x="112" y="91" font-family="Arial,sans-serif" font-size="15" fill="#60758b">3 pages</text><text x="28" y="155" font-family="Arial,sans-serif" font-size="17" fill="#5d7084">2 · Drag to reorder</text><text x="28" y="190" font-family="Arial,sans-serif" font-size="17" fill="#5d7084">No file upload</text></g>
<path d="M665 350h95m-18-18 18 18-18 18" fill="none" stroke="#3779b2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(790 235)"><rect width="250" height="230" rx="16" fill="#edf8f1" stroke="#a5cfb4" stroke-width="3"/><rect x="28" y="25" width="62" height="78" rx="8" fill="#fff" stroke="#3f8c5d" stroke-width="3"/><text x="112" y="62" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#24563a">merged.pdf</text><text x="112" y="91" font-family="Arial,sans-serif" font-size="15" fill="#50735e">5 pages</text><rect x="28" y="145" width="194" height="48" rx="10" fill="#28784b"/><text x="125" y="176" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#fff">Download PDF</text></g>
<text x="600" y="520" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#6b7d90">Illustrative workflow graphic — not a live product screenshot.</text>
