<p class="eyebrow">Help improve Files Format</p><h1>Feedback and bug reports</h1>
<p class="summary">This form prepares a GitHub issue. Nothing is sent to a Files Format server; GitHub opens in a new tab and asks you to review and submit your report.</p>
<form action="https://github.com/Gaurav01MH/everyday-tools-python/issues/new" method="get" target="_blank">
<p><label for="title">Subject</label><input id="title" name="title" maxlength="120" required placeholder="What would you like to report?"></p>
<p><label for="body">Details</label><textarea id="body" name="body" rows="8" required placeholder="What happened? What did you expect? Do not include private files or personal information."></textarea></p>
<p><button type="submit">Continue to GitHub Issues</button></p>
</form>
<p><a href="https://github.com/Gaurav01MH/everyday-tools-python/issues">View existing issues</a> · <a href="../about/">About Files Format</a></p>
