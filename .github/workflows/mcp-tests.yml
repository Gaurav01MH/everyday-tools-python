name: MCP server checks

on:
  push:
    branches:
      - main
    paths:
      - "mcp-server/**"
      - "web/**"
      - ".github/workflows/mcp-tests.yml"
  pull_request:
    paths:
      - "mcp-server/**"
      - "web/**"
      - ".github/workflows/mcp-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Build website assets for the Worker
        working-directory: web
        env:
          PUBLIC_BASE_PATH: "/"
          PUBLIC_SITE_ORIGIN: "https://too-broke-for-a-custom-domain.pages.dev"
          VITE_SHARE_API_ENABLED: "true"
          VITE_TURNSTILE_SITE_KEY: "test-site-key-for-ci-only"
        run: npm install --no-audit --no-fund && npm run build
      - name: Check generated website pages
        working-directory: web
        env:
          PUBLIC_BASE_PATH: "/"
        run: node scripts/check-seo-output.mjs
      - name: Install MCP dependencies
        working-directory: mcp-server
        run: npm install --no-audit --no-fund
      - name: Audit MCP dependencies
        working-directory: mcp-server
        run: npm audit --audit-level=high
      - name: Run MCP unit tests
        working-directory: mcp-server
        run: npm test
      - name: Validate Cloudflare Worker and static assets
        working-directory: mcp-server
        run: npx wrangler deploy --dry-run
